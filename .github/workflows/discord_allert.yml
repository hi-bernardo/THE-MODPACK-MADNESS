name: Aviso de Atualizacao no Discord

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensagem para o Discord
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            @everyone 🚀 **NOVA ATUALIZAÇÃO DISPONÍVEL!**
            A versão **${{ github.event.release.tag_name }}** do *Modpack Madness* já está disponivel!
            
            ${{ github.event.release.body }}

            Rode o script no seu PC para aplicar a nova versão sem perder seus mundos!
            *(Perdeu o comando de instalação? Vá no canal <#1509759760587554970>)*

            🔗 **Download e Detalhes:** 
            ${{ github.event.release.html_url }}
